[project]
name = "pos-mcp"
version = "0.2.0"
description = "MCP server for 80mm thermal printers with browser preview, approval workflow, and full Unicode rendering"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "python-escpos>=3.0",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "graphviz>=0.20",
    "qrcode>=7.4",
    "python-barcode>=0.15",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
pos-mcp = "pos_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pos_mcp = ["preview.html"]
