[project]
name = "pos-mcp"
version = "0.1.0"
description = "MCP server for 80mm thermal POS printer"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "python-escpos>=3.0",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "graphviz>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pos-mcp = "pos_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
